# Автообновление сайта: раз в 6 часов пересобирает страницы со свежими данными Банка России и МосБиржи
# и публикует их на GitHub Pages (в том числе новые «Разборы» после решений ЦБ).
#
# Чтобы заработало, один раз: Settings -> Pages -> Source: GitHub Actions.
# Запуск вручную: вкладка Actions -> «Обновление сайта» -> Run workflow.
name: Обновление сайта

on:
  schedule:
    - cron: "0 */6 * * *"      # время UTC; GitHub может запускать с задержкой
  workflow_dispatch:

permissions:
  contents: read            # по умолчанию только чтение; права на публикацию выданы ниже только нужной задаче

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: pysite 6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false      # токен не остаётся в клоне репозитория
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать сайт
        run: python build_static.py --require-live
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pysite 6/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
