<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · {{ team.name }}</title>
<meta name="description" content="{% block description %}{% endblock %}">
<meta property="og:type" content="{% block ogtype %}website{% endblock %}">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
{% if page_url %}<link rel="canonical" href="{{ page_url }}">
<meta property="og:url" content="{{ page_url }}">
{% endif %}<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1714" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F5C45'/%3E%3Cpath d='M6 22l7-8 5 4 8-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
{% include "_theme.html" %}
{% block ld %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" media="print">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main">К содержимому</a>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="{{ root }}">{{ team.name }}</a>
    <nav class="nav" aria-label="Разделы">
      <a href="{{ root }}#dannye">Данные</a>
      <a href="{{ root }}#kalkulyatory">Калькуляторы</a>
      <a href="{{ root }}razbory/">Разборы</a>
      <a href="{{ root }}slovar/">Словарь</a>
      <a href="{{ root }}metodika/">Методика</a>
      <a href="{{ root }}#o-nas">О нас</a>
    </nav>
    <button type="button" class="theme-btn" id="theme-btn" aria-pressed="false" aria-label="Тёмная тема"><span class="ti" aria-hidden="true"></span><span class="tl">Тёмная тема</span></button>
  </header>
  <main id="main">
{% block content %}{% endblock %}
  </main>
  <footer>© {{ team.year }} {{ team.name }} · <a href="{{ root }}">На главную</a> · <a href="{{ root }}slovar/">Словарь</a> · <a href="{{ root }}metodika/">Методика и источники</a></footer>
</div>
</body>
</html>
